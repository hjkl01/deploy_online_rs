<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Deploy Online</title>
<style>
:root{--bg:#0b1220;--panel:#121a2b;--panel2:#182234;--border:#243049;--text:#e8eefc;--muted:#8b9bb8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 10% -10%,#1a2744 0%,var(--bg) 55%)}
button,input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
button{background:linear-gradient(180deg,#3b82f6,#2563eb);border:none;cursor:pointer;font-weight:600}
button.secondary{background:var(--panel2);border:1px solid var(--border)}button.danger{background:linear-gradient(180deg,#f87171,#dc2626)}
button:disabled{opacity:.5;cursor:not-allowed}input,textarea{width:100%}textarea{min-height:260px;font-family:ui-monospace,monospace;font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.grid{display:grid;gap:12px}.grid.projects{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.muted{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.error{color:#fca5a5}
.badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--border);background:var(--panel2)}
.badge.ok{color:#86efac;border-color:#166534}.badge.fail{color:#fca5a5;border-color:#7f1d1d}
.badge.run{color:#93c5fd;border-color:#1e3a8a}.badge.pend{color:#fcd34d;border-color:#854d0e}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(400px,100%)}
h1,h2,h3{margin:0 0 8px}
.logs{background:#070b14;border:1px solid var(--border);border-radius:12px;padding:12px;height:420px;overflow:auto;font-family:ui-monospace,monospace;font-size:12.5px;white-space:pre-wrap}
.logs .stderr{color:#fca5a5}.logs .system{color:#93c5fd}.logs .stdout{color:#d1d5db}
.steps{display:grid;gap:6px;margin:12px 0}
.step{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const api=(path,opts={})=>fetch(path,{credentials:"include",headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});
const state={me:null,view:"home",projects:[],deployments:[],currentDeployment:null,logs:"",ws:null,edit:{id:null,name:"",description:"",yaml:"",enabled:true,secrets:[]}};
function statusBadge(s){const map={success:["ok","成功"],failed:["fail","失败"],running:["run","运行中"],pending:["pend","等待"],cancelled:["fail","已取消"]};const [cls,label]=map[s]||["",s||"-"];return `<span class="badge ${cls}">${label}</span>`;}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function defaultYaml(){return `name: my-app\ndescription: example\npath: ~/apps/my-app\ngit:\n  url: https://github.com/example/my-app.git\n  branch: main\nshell: bash\nsteps:\n  - name: Sync\n    action: sync\n  - name: Build\n    run: echo "put your build command here"\n    timeout: 600\n`;}
function render(){const root=document.getElementById("app");if(!state.me){root.innerHTML=`<div class="login-shell"><div class="card login-card"><div class="brand"><div class="brand-mark">D</div><div><strong>Deploy Online</strong><div class="muted">YAML · 本机部署</div></div></div><label>用户名</label><input id="u" value="admin"/><label>密码</label><input id="p" type="password"/><div style="height:12px"></div><button id="login-btn" style="width:100%">登录</button><p class="error" id="login-err"></p></div></div>`;document.getElementById("login-btn").onclick=doLogin;document.getElementById("p").onkeydown=e=>{if(e.key==="Enter")doLogin()};return;}const nav=`<div class="topbar"><div class="brand"><div class="brand-mark">D</div><div><div><strong>Deploy Online</strong></div><div class="muted">${esc(state.me.username)} · ${esc(state.me.role)}</div></div></div><div class="nav"><button class="secondary" data-go="home">总览</button><button class="secondary" data-go="projects">项目</button><button class="secondary" data-go="deployments">部署记录</button><button class="secondary" id="logout">退出</button></div></div>`;let body="";if(state.view==="home")body=viewHome();else if(state.view==="projects")body=viewProjects();else if(state.view==="edit")body=viewEdit();else if(state.view==="deployments")body=viewDeployments();else if(state.view==="deployment")body=viewDeployment();root.innerHTML=`<div class="wrap">${nav}${body}</div>`;bindCommon();}
function projectCard(p){return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(p.name)}</h3><span class="badge ${p.enabled?"ok":"fail"}">${p.enabled?"已启用":"已禁用"}</span></div><p class="muted">${esc(p.description||"无描述")}</p><div class="row"><button data-deploy="${p.id}" ${p.enabled?"":"disabled"}>部署</button><button class="secondary" data-edit="${p.id}">编辑</button></div></div>`;}
function viewHome(){const enabled=state.projects.filter(p=>p.enabled).length;return `<div style="margin-bottom:20px"><h1>部署控制台</h1><p class="muted">YAML 描述 clone / build / restart，本机执行，无需 Docker。</p></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:16px"><div class="card"><div class="muted">项目</div><h2>${state.projects.length}</h2><div class="muted">${enabled} 已启用</div></div><div class="card"><div class="muted">最近部署</div><h2>${state.deployments.length}</h2></div></div><div class="row" style="margin-bottom:12px"><button data-go="edit" data-new="1">＋ 新建项目</button><button class="secondary" data-go="projects">管理项目</button></div><h3>项目</h3><div class="grid projects" style="margin-top:8px">${state.projects.map(projectCard).join("")||'<p class="muted">暂无项目</p>'}</div>`;}
function viewProjects(){return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>项目</h1><button data-go="edit" data-new="1">＋ 新建</button></div><div class="grid projects">${state.projects.map(projectCard).join("")||'<p class="muted">空</p>'}</div>`;}
function viewEdit(){const e=state.edit,isNew=!e.id;return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>${isNew?"新建项目":"编辑 "+esc(e.name)}</h1><button class="secondary" data-go="projects">返回</button></div><div class="card"><label>名称</label><input id="e-name" value="${esc(e.name)}"/><label>描述</label><input id="e-desc" value="${esc(e.description)}"/><label>启用</label><select id="e-enabled"><option value="1" ${e.enabled?"selected":""}>是</option><option value="0" ${!e.enabled?"selected":""}>否</option></select><label>工作流 YAML</label><textarea id="e-yaml">${esc(e.yaml||defaultYaml())}</textarea><div class="row" style="margin-top:12px"><button id="e-save">保存</button>${!isNew?'<button class="danger" id="e-del">删除项目</button>':""}</div><p class="error" id="e-err"></p></div>${!isNew?`<div class="card" style="margin-top:12px"><h3>Secrets</h3><p class="muted">加密存储，部署时注入环境变量</p><div class="row"><input id="s-key" placeholder="KEY" style="max-width:180px"/><input id="s-val" placeholder="value" type="password" style="max-width:240px"/><button id="s-add">添加/更新</button></div><div style="margin-top:10px">${(e.secrets||[]).map(k=>`<div class="row" style="margin:4px 0"><span class="badge">${esc(k)}</span><button class="secondary" data-sdel="${esc(k)}">删除</button></div>`).join("")||'<span class="muted">无</span>'}</div></div>`:""}`;}function viewDeployments(){return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>部署记录</h1><button class="secondary" id="dep-refresh">刷新</button></div><div class="grid">${state.deployments.map(d=>`<div class="card row" style="justify-content:space-between"><div><strong>#${d.id}</strong> ${esc(d.project_name)}<div class="muted">${esc(d.created_at||"")}</div></div><div class="row">${statusBadge(d.status)}<button class="secondary" data-open-dep="${d.id}">查看</button></div></div>`).join("")||'<p class="muted">暂无记录</p>'}</div>`;}
function viewDeployment(){const d=state.currentDeployment?.deployment||state.currentDeployment||{};const steps=state.currentDeployment?.steps||[];return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h1>部署 #${d.id||""}</h1><div class="muted">${esc(d.project_name||"")}</div></div><div class="row">${statusBadge(d.status)}${["pending","running"].includes(d.status)?'<button class="danger" id="dep-cancel">取消</button>':""}<button class="secondary" data-go="deployments">返回</button></div></div><div class="steps">${steps.map(s=>`<div class="step"><span>${esc(s.name)}</span><span>${statusBadge(s.status)} ${s.duration_ms!=null?s.duration_ms+"ms":""}</span></div>`).join("")}</div><div class="logs" id="logbox">${state.logs}</div>`;}
function bindCommon(){document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{closeWs();if(el.dataset.new){state.edit={id:null,name:"",description:"",yaml:defaultYaml(),enabled:true,secrets:[]};state.view="edit";}else state.view=el.dataset.go;render();if(state.view==="deployments")loadDeployments();if(state.view==="home"||state.view==="projects")loadProjects();});const lo=document.getElementById("logout");if(lo)lo.onclick=async()=>{await api("/api/auth/logout",{method:"POST"});state.me=null;closeWs();render();};document.querySelectorAll("[data-deploy]").forEach(el=>el.onclick=async()=>{const r=await api("/api/projects/"+el.dataset.deploy+"/deploy",{method:"POST"});if(!r.ok){alert((await r.json()).detail||"失败");return;}openDeployment((await r.json()).id);});document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEdit(+el.dataset.edit));document.querySelectorAll("[data-open-dep]").forEach(el=>el.onclick=()=>openDeployment(+el.dataset.openDep));const save=document.getElementById("e-save");if(save)save.onclick=saveProject;const del=document.getElementById("e-del");if(del)del.onclick=deleteProject;const sadd=document.getElementById("s-add");if(sadd)sadd.onclick=addSecret;document.querySelectorAll("[data-sdel]").forEach(el=>el.onclick=()=>delSecret(el.dataset.sdel));const refr=document.getElementById("dep-refresh");if(refr)refr.onclick=loadDeployments;const cancel=document.getElementById("dep-cancel");if(cancel)cancel.onclick=async()=>{await api("/api/deployments/"+state.currentDeployment.deployment.id+"/cancel",{method:"POST"});};}
async function doLogin(){const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify({username:document.getElementById("u").value.trim(),password:document.getElementById("p").value})});if(!r.ok){document.getElementById("login-err").textContent="用户名或密码错误";return;}await boot();}
async function boot(){const me=await api("/api/auth/me");if(!me.ok){state.me=null;render();return;}state.me=await me.json();state.view="home";await loadProjects();await loadDeployments();render();}
async function loadProjects(){const r=await api("/api/projects");if(r.ok)state.projects=await r.json();if(state.view==="home"||state.view==="projects")render();}
async function loadDeployments(){const r=await api("/api/deployments?page=1&page_size=30");if(r.ok)state.deployments=(await r.json()).items||[];if(state.view==="deployments"||state.view==="home")render();}
async function openEdit(id){const r=await api("/api/projects/"+id);if(!r.ok)return;const p=await r.json();let secrets=[];const s=await api("/api/projects/"+id+"/secrets");if(s.ok)secrets=(await s.json()).keys||[];state.edit={id:p.id,name:p.name,description:p.description,yaml:p.yaml,enabled:p.enabled,secrets};state.view="edit";render();}
async function saveProject(){const body={name:document.getElementById("e-name").value.trim(),description:document.getElementById("e-desc").value.trim(),yaml:document.getElementById("e-yaml").value,enabled:document.getElementById("e-enabled").value==="1"};const id=state.edit.id;const r=await api(id?"/api/projects/"+id:"/api/projects",{method:id?"PUT":"POST",body:JSON.stringify(body)});if(!r.ok){const j=await r.json().catch(()=>({}));document.getElementById("e-err").textContent=j.detail||"保存失败";return;}await loadProjects();state.view="projects";render();}
async function deleteProject(){if(!confirm("确认删除项目？"))return;await api("/api/projects/"+state.edit.id,{method:"DELETE"});await loadProjects();state.view="projects";render();}
async function addSecret(){const r=await api("/api/projects/"+state.edit.id+"/secrets",{method:"POST",body:JSON.stringify({key:document.getElementById("s-key").value.trim(),value:document.getElementById("s-val").value})});if(!r.ok){alert("失败");return;}openEdit(state.edit.id);}
async function delSecret(key){await api("/api/projects/"+state.edit.id+"/secrets/"+encodeURIComponent(key),{method:"DELETE"});openEdit(state.edit.id);}
function closeWs(){if(state.ws){try{state.ws.close();}catch{}state.ws=null;}}
async function openDeployment(id){closeWs();state.logs="";const r=await api("/api/deployments/"+id);if(!r.ok)return;state.currentDeployment=await r.json();state.view="deployment";render();connectWs(id);}
function connectWs(id){const proto=location.protocol==="https:"?"wss":"ws";const ws=new WebSocket(`${proto}://${location.host}/api/deployments/${id}/ws`);state.ws=ws;ws.onmessage=(ev)=>{let msg;try{msg=JSON.parse(ev.data);}catch{return;}if(msg.type==="snapshot"){state.logs=(msg.logs||[]).map(formatLog).join("");const box=document.getElementById("logbox");if(box){box.innerHTML=state.logs;box.scrollTop=box.scrollHeight;}}else if(msg.type==="log"){state.logs+=formatLog(msg);const box=document.getElementById("logbox");if(box){box.innerHTML=state.logs;box.scrollTop=box.scrollHeight;}}else if(msg.type==="status"){if(state.currentDeployment?.deployment){state.currentDeployment.deployment.status=msg.status;state.currentDeployment.deployment.exit_code=msg.exit_code;state.currentDeployment.steps=msg.steps||state.currentDeployment.steps;}const keep=state.logs;render();state.logs=keep;const box=document.getElementById("logbox");if(box)box.innerHTML=keep;bindCommon();}};}
function formatLog(x){const cls=x.stream==="stderr"?"stderr":x.stream==="system"?"system":"stdout";return `<span class="${cls}">${esc(x.message)}</span>`;}
boot();
</script>
</body>
</html>
