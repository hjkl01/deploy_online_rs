# 项目工作流配置（GitHub Actions 风格，本地执行，无需 Docker）
#
# 放置位置（任选其一）:
#   1. 由 Web UI 保存到数据库
#   2. 文件系统: ~/.config/deploy_online/projects/<name>.yaml
#
# 内置 action:
#   - sync: 目录不存在则 git clone，已存在则 checkout + pull --ff-only

name: blog
description: 个人博客部署

# 本地工作目录（支持 ~ 展开）
path: ~/apps/blog

git:
  url: https://github.com/example/blog.git
  branch: main
  # depth: 1          # 可选浅克隆
  # submodules: false

# 默认 shell: bash | zsh
shell: bash

# 非密钥环境变量（密钥请在 UI / secrets 中配置，运行时注入）
env:
  NODE_ENV: production
  # APP_ENV: prod

# 步骤按顺序执行；任一步失败且未设置 continue_on_error 则终止
steps:
  - name: Sync source
    action: sync          # 内置：clone 或 pull

  - name: Backend deps
    run: uv sync
    dir: backend          # 相对 path
    timeout: 600

  - name: Frontend install
    run: npm ci
    dir: frontend
    timeout: 600

  - name: Frontend build
    run: npm run build
    dir: frontend
    timeout: 900

  - name: Restart service
    run: systemctl --user restart blog.service
    timeout: 60
    # continue_on_error: false

  - name: Health check
    action: health_check
    url: http://127.0.0.1:3000/health
    timeout: 30
